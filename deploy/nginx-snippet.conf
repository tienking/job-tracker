# ── Thêm vào server block HTTPS trong /etc/nginx/sites-available/tienmai ──────
#
# Đặt các location này TRƯỚC location / (root) — more specific matches first.
# Lưu ý: location và alias đều phải có dấu / ở cuối để try_files serve đúng file.

    # JT Admin SPA — exact match, serve admin.html
    location = /jobtracker/admin {
        alias /root/job-tracker/frontend/dist/admin.html;
        default_type text/html;
    }

    # Redirect /jobtracker -> /jobtracker/ (để alias hoạt động đúng)
    location = /jobtracker {
        return 301 /jobtracker/;
    }

    # JT App SPA — serve file thật trước, fallback index.html cho client-side routes
    location /jobtracker/ {
        alias /root/job-tracker/frontend/dist/;
        try_files $uri $uri/ /jobtracker/index.html;
    }

    # JT Admin API — proxy to port 8001
    location /api/jtadmin/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 20m;
    }

    # JT User API — proxy to port 8001 (was port 8000 before)
    location /api/jobtracker/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 20m;
    }

# ── Xóa /api/admin/jobtracker/ khỏi block proxy port 8000 sau khi tách xong ──
