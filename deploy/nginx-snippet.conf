# ── Thêm vào server block HTTPS trong /etc/nginx/sites-available/tienmai ──────
#
# Đặt các location này TRƯỚC location /jobtracker hiện tại (more specific first)

    # JT Admin SPA — phải đặt trước /jobtracker để có độ ưu tiên cao hơn
    location = /jobtracker/admin {
        alias /root/jobtracker/frontend/dist;
        try_files /admin.html /admin.html;
    }

    # JT App SPA
    location /jobtracker {
        alias /root/jobtracker/frontend/dist;
        try_files /index.html /index.html;
    }

    # JT Admin API — proxy to port 8001
    location /api/jtadmin/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 20m;
    }

    # JT User API — proxy to port 8001 (was port 8000 before)
    location /api/jobtracker/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 20m;
    }

# ── Xóa /api/admin/jobtracker/ khỏi block proxy port 8000 sau khi tách xong ──
